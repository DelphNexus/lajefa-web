server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # HTML siempre fresco: el navegador pregunta cada vez, así un cambio de
    # precios se ve al instante (app.js y styles.css ya llevan ?v= para eso).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Fotos y fuentes casi no cambian: se guardan 30 días.
    location ~* \.(jpg|jpeg|png|webp|otf|ttf)$ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
