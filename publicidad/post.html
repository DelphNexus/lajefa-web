<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Post Cyber Week 1080x1080</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; }

  .post {
    position:relative; width:1080px; height:1080px;
    background:
      radial-gradient(620px 460px at 50% 44%, rgba(242,145,124,.20), transparent 64%),
      radial-gradient(760px 520px at 50% -10%, rgba(138,79,208,.42), transparent 62%),
      linear-gradient(168deg,#1b0836 0%,#2b1152 46%,#3d1a68 100%);
    font-family:'Baloo 2',sans-serif; color:#fff; overflow:hidden;
  }

  /* piso de neón en perspectiva */
  .floor { position:absolute; left:-30%; right:-30%; bottom:0; height:430px;
    background:
      repeating-linear-gradient(90deg, rgba(242,145,124,.42) 0 2px, transparent 2px 92px),
      repeating-linear-gradient(0deg, rgba(242,145,124,.30) 0 2px, transparent 2px 62px);
    transform:perspective(420px) rotateX(66deg); transform-origin:bottom center;
    mask-image:linear-gradient(to top, #000 8%, transparent 82%);
    -webkit-mask-image:linear-gradient(to top, #000 8%, transparent 82%); }

  /* líneas de barrido tipo pantalla */
  .scan { position:absolute; inset:0; pointer-events:none; opacity:.10;
    background:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 5px); }

  .checker { position:absolute; left:0; right:0; height:28px;
    background:repeating-conic-gradient(#f2917c 0% 25%, transparent 0% 50%) 0 0/28px 28px; }
  .checker.top { top:0; } .checker.bot { bottom:0; }

  .glow { position:absolute; border-radius:50%; filter:blur(100px); }
  .g1 { width:520px; height:520px; background:#8a4fd0; opacity:.55; top:-180px; left:-160px; }
  .g2 { width:420px; height:420px; background:#f2917c; opacity:.30; bottom:-140px; right:-130px; }

  /* esquinas tipo visor */
  .bracket { position:absolute; width:74px; height:74px; border:4px solid rgba(242,145,124,.72); }
  .b1{top:60px;left:44px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
  .b2{top:60px;right:44px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
  .b3{bottom:60px;left:44px;border-right:0;border-top:0;border-radius:0 0 0 14px}
  .b4{bottom:60px;right:44px;border-left:0;border-top:0;border-radius:0 0 14px 0}

  .spark { position:absolute; color:#f7b3a4; }
  .s1{top:250px;left:96px;font-size:26px}
  .s2{top:206px;right:104px;font-size:34px}
  .s3{bottom:352px;left:74px;font-size:22px}
  .s4{bottom:400px;right:78px;font-size:26px}

  .logo { position:absolute; top:74px; left:50%; transform:translateX(-50%);
    width:132px; height:132px; object-fit:contain;
    filter:drop-shadow(0 6px 20px rgba(0,0,0,.5)); }

  /* CYBER WEEK en neón */
  .neon { position:absolute; top:196px; left:0; right:0; text-align:center;
    font-family:'Lilita One',sans-serif; font-size:100px; line-height:.9;
    letter-spacing:3px; color:#fff;
    text-shadow:
      0 0 8px rgba(255,255,255,.95),
      0 0 26px rgba(242,145,124,.95),
      0 0 60px rgba(242,145,124,.7),
      0 0 110px rgba(138,79,208,.75); }
  .neon small { display:block; font-size:34px; letter-spacing:13px;
    color:#f7b3a4; text-shadow:0 0 18px rgba(242,145,124,.8); margin-bottom:2px; }

  .dates { position:absolute; top:338px; left:50%; transform:translateX(-50%);
    background:#f2917c; color:#1b0836; font-weight:800; font-size:24px;
    letter-spacing:3px; padding:10px 32px; border-radius:999px; white-space:nowrap;
    box-shadow:0 0 30px rgba(242,145,124,.65); }

  .slogan { position:absolute; top:394px; left:0; right:0; text-align:center;
    font-family:'Lilita One',sans-serif; font-size:38px; line-height:1.06; letter-spacing:.5px;
    text-transform:uppercase; color:#fff; text-shadow:0 6px 20px rgba(0,0,0,.5); }
  .slogan em { font-style:normal; color:#f2917c; }

  /* hamburguesa con anillos */
  .ring { position:absolute; left:50%; top:668px; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(242,145,124,.35); }
  .r1 { width:404px; height:404px; }
  .r2 { width:458px; height:458px; border-color:rgba(242,145,124,.18); }

  .burger { position:absolute; top:668px; left:50%; transform:translate(-50%,-50%);
    width:348px; height:348px; object-fit:cover; border-radius:50%;
    border:9px solid #f2917c;
    box-shadow:0 0 46px rgba(242,145,124,.6), 0 26px 60px rgba(0,0,0,.6); }

  .side { position:absolute; width:140px; height:140px; object-fit:cover;
    border-radius:50%; border:6px solid #f2917c;
    box-shadow:0 0 26px rgba(242,145,124,.45), 0 14px 30px rgba(0,0,0,.5); }
  .side.l { left:62px; top:606px; transform:rotate(-11deg); }
  .side.r { right:62px; top:606px; transform:rotate(11deg); }

  /* bloque de descuento tipo terminal */
  .deal { position:absolute; top:858px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:20px;
    background:rgba(11,4,26,.72); border:2px solid #f2917c; border-radius:20px;
    padding:12px 28px; white-space:nowrap; box-shadow:0 0 34px rgba(242,145,124,.4); }
  .deal .off { font-family:'Lilita One',sans-serif; font-size:48px; color:#f2917c;
    line-height:1; text-shadow:0 0 22px rgba(242,145,124,.85); }
  .deal .txt { font-size:19px; font-weight:700; line-height:1.25; }
  .deal .code { display:inline-block; font-family:'Lilita One',sans-serif;
    font-size:27px; letter-spacing:2px; color:#1b0836; background:#f7b3a4;
    padding:2px 12px; border-radius:8px; }

  .url { position:absolute; top:948px; left:50%; transform:translateX(-50%);
    background:#f2917c; color:#1b0836; font-family:'Lilita One',sans-serif;
    font-size:34px; padding:11px 40px; border-radius:999px; white-space:nowrap;
    box-shadow:0 0 40px rgba(242,145,124,.6); }

  .only { position:absolute; top:1018px; left:0; right:0; text-align:center;
    font-size:16px; font-weight:800; letter-spacing:1.4px; color:#f7b3a4;
    text-transform:uppercase; }
</style>
</head>
<body>
<div class="post">
  <span class="glow g1"></span><span class="glow g2"></span>
  <span class="floor"></span>
  <span class="checker top"></span>

  <span class="bracket b1"></span><span class="bracket b2"></span>
  <span class="bracket b3"></span><span class="bracket b4"></span>

  <span class="spark s1">✦</span><span class="spark s2">✦</span>
  <span class="spark s3">✧</span><span class="spark s4">✦</span>

  <img class="logo" src="../images/brand/logo-blanco.png" alt="">

  <div class="neon"><small>LA JEFA</small>CYBER WEEK</div>
  <span class="dates">3 AL 8 DE AGOSTO</span>

  <div class="slogan">Tu burger, a tu gusto,<br><em>en 3 toques</em></div>

  <span class="ring r2"></span><span class="ring r1"></span>
  <img class="side l" src="../images/papas-clasicas.jpg" alt="">
  <img class="side r" src="../images/pepsi.jpg" alt="">
  <img class="burger" src="../images/la-consentida.jpg" alt="">

  <div class="deal">
    <span class="off">10%</span>
    <span class="txt">de descuento con el código<br><span class="code">LAJEFA10</span></span>
  </div>

  <span class="url">lajefa.delphbrothers.com</span>
  <span class="only">Promo válida solo en pedidos por la web</span>

  <span class="scan"></span>
  <span class="checker bot"></span>
</div>
</body>
</html>
