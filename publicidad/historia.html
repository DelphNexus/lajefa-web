<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Historia Cyber Week 1080x1920</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; overflow:hidden; }

  .story {
    position:relative; width:1080px; height:1920px;
    background:
      radial-gradient(700px 560px at 50% 46%, rgba(242,145,124,.20), transparent 64%),
      radial-gradient(880px 640px at 50% -6%, rgba(138,79,208,.44), transparent 62%),
      linear-gradient(172deg,#1b0836 0%,#2b1152 46%,#3d1a68 100%);
    font-family:'Baloo 2',sans-serif; color:#fff; overflow:hidden;
  }

  .floor { position:absolute; left:-30%; right:-30%; bottom:0; height:620px;
    background:
      repeating-linear-gradient(90deg, rgba(242,145,124,.42) 0 3px, transparent 3px 104px),
      repeating-linear-gradient(0deg, rgba(242,145,124,.30) 0 3px, transparent 3px 74px);
    transform:perspective(520px) rotateX(68deg); transform-origin:bottom center;
    mask-image:linear-gradient(to top,#000 8%,transparent 84%);
    -webkit-mask-image:linear-gradient(to top,#000 8%,transparent 84%); }

  .scan { position:absolute; inset:0; pointer-events:none; opacity:.09;
    background:repeating-linear-gradient(0deg,#fff 0 1px, transparent 1px 5px); }

  .checker { position:absolute; left:0; right:0; height:32px;
    background:repeating-conic-gradient(#f2917c 0% 25%, transparent 0% 50%) 0 0/32px 32px; }
  .checker.top { top:0; } .checker.bot { bottom:0; }

  .glow { position:absolute; border-radius:50%; filter:blur(120px); }
  .g1 { width:660px; height:660px; background:#8a4fd0; opacity:.55; top:-200px; left:-200px; }
  .g2 { width:560px; height:560px; background:#f2917c; opacity:.28; bottom:180px; right:-190px; }

  .bracket { position:absolute; width:90px; height:90px; border:5px solid rgba(242,145,124,.72); }
  .b1{top:90px;left:52px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
  .b2{top:90px;right:52px;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
  .b3{bottom:90px;left:52px;border-right:0;border-top:0;border-radius:0 0 0 18px}
  .b4{bottom:90px;right:52px;border-left:0;border-top:0;border-radius:0 0 18px 0}

  .spark { position:absolute; color:#f7b3a4; }
  .s1{top:560px;left:92px;font-size:32px}
  .s2{top:492px;right:98px;font-size:42px}
  .s3{bottom:640px;left:74px;font-size:26px}
  .s4{bottom:720px;right:80px;font-size:30px}

  .logo { position:absolute; top:150px; left:50%; transform:translateX(-50%);
    width:210px; height:210px; object-fit:contain;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.5)); }

  .neon { position:absolute; top:404px; left:0; right:0; text-align:center;
    font-family:'Lilita One',sans-serif; font-size:130px; line-height:.9;
    letter-spacing:3px; color:#fff;
    text-shadow:
      0 0 10px rgba(255,255,255,.95),
      0 0 32px rgba(242,145,124,.95),
      0 0 74px rgba(242,145,124,.7),
      0 0 140px rgba(138,79,208,.78); }
  .neon small { display:block; font-size:44px; letter-spacing:17px;
    color:#f7b3a4; text-shadow:0 0 22px rgba(242,145,124,.8); margin-bottom:6px; }

  .dates { position:absolute; top:590px; left:50%; transform:translateX(-50%);
    background:#f2917c; color:#1b0836; font-weight:800; font-size:31px;
    letter-spacing:4px; padding:13px 42px; border-radius:999px; white-space:nowrap;
    box-shadow:0 0 36px rgba(242,145,124,.65); }

  .slogan { position:absolute; top:672px; left:0; right:0; text-align:center;
    font-family:'Lilita One',sans-serif; font-size:52px; line-height:1.08;
    text-transform:uppercase; color:#fff; text-shadow:0 8px 24px rgba(0,0,0,.5); }
  .slogan em { font-style:normal; color:#f2917c; }

  .ring { position:absolute; left:50%; top:1080px; transform:translate(-50%,-50%);
    border-radius:50%; border:3px solid rgba(242,145,124,.35); }
  .r1 { width:566px; height:566px; }
  .r2 { width:646px; height:646px; border-color:rgba(242,145,124,.18); }

  .burger { position:absolute; top:1080px; left:50%; transform:translate(-50%,-50%);
    width:490px; height:490px; object-fit:cover; border-radius:50%;
    border:12px solid #f2917c;
    box-shadow:0 0 60px rgba(242,145,124,.6), 0 30px 70px rgba(0,0,0,.6); }

  .side { position:absolute; width:186px; height:186px; object-fit:cover;
    border-radius:50%; border:7px solid #f2917c;
    box-shadow:0 0 30px rgba(242,145,124,.45), 0 16px 34px rgba(0,0,0,.5); }
  .side.l { left:66px; top:1000px; transform:rotate(-11deg); }
  .side.r { right:66px; top:1000px; transform:rotate(11deg); }

  .deal { position:absolute; top:1408px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:24px;
    background:rgba(11,4,26,.72); border:3px solid #f2917c; border-radius:26px;
    padding:18px 40px; white-space:nowrap; box-shadow:0 0 40px rgba(242,145,124,.4); }
  .deal .off { font-family:'Lilita One',sans-serif; font-size:66px; color:#f2917c;
    line-height:1; text-shadow:0 0 26px rgba(242,145,124,.85); }
  .deal .txt { font-size:25px; font-weight:700; line-height:1.25; }
  .deal .code { display:inline-block; font-family:'Lilita One',sans-serif;
    font-size:36px; letter-spacing:2px; color:#1b0836; background:#f7b3a4;
    padding:2px 16px; border-radius:10px; }

  .url { position:absolute; top:1566px; left:50%; transform:translateX(-50%);
    background:#f2917c; color:#1b0836; font-family:'Lilita One',sans-serif;
    font-size:46px; padding:16px 52px; border-radius:999px; white-space:nowrap;
    box-shadow:0 0 46px rgba(242,145,124,.6); }

  .only { position:absolute; top:1664px; left:0; right:0; text-align:center;
    font-size:21px; font-weight:800; letter-spacing:1.6px; color:#f7b3a4;
    text-transform:uppercase; }

  .swipe { position:absolute; top:1748px; left:0; right:0; text-align:center;
    font-size:30px; font-weight:800; color:#fff; letter-spacing:1px;
    text-shadow:0 0 20px rgba(242,145,124,.8); }

  .foot { position:absolute; top:1830px; left:0; right:0; text-align:center;
    font-size:21px; font-weight:700; opacity:.85; }
</style>
</head>
<body>
<div class="story">
  <span class="glow g1"></span><span class="glow g2"></span>
  <span class="floor"></span>
  <span class="checker top"></span>

  <span class="bracket b1"></span><span class="bracket b2"></span>
  <span class="bracket b3"></span><span class="bracket b4"></span>

  <span class="spark s1">✦</span><span class="spark s2">✦</span>
  <span class="spark s3">✧</span><span class="spark s4">✦</span>

  <img class="logo" src="../images/brand/logo-blanco.png" alt="">

  <div class="neon"><small>LA JEFA</small>CYBER WEEK</div>
  <span class="dates">3 AL 8 DE AGOSTO</span>

  <div class="slogan">Tu burger, a tu gusto,<br><em>en 3 toques</em></div>

  <span class="ring r2"></span><span class="ring r1"></span>
  <img class="side l" src="../images/papas-clasicas.jpg" alt="">
  <img class="side r" src="../images/pepsi.jpg" alt="">
  <img class="burger" src="../images/la-consentida.jpg" alt="">

  <div class="deal">
    <span class="off">10%</span>
    <span class="txt">de descuento con el código<br><span class="code">LAJEFA10</span></span>
  </div>

  <span class="url">lajefa.delphbrothers.com</span>
  <span class="only">Promo válida solo en pedidos por la web</span>
  <span class="swipe">🔗 Entra a la web y pide</span>
  <span class="foot">🛵 Cayambe · Lunes a sábado 3:30 PM – 10:00 PM</span>

  <span class="scan"></span>
  <span class="checker bot"></span>
</div>
</body>
</html>
